# ==========================================
# Host-level Nginx Configuration Example (WSL / Host)
# ==========================================
# Use this if you run Nginx directly on the host OS / WSL

upstream active_app {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    # When switched to green:
    # server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost _;

    location / {
        proxy_pass http://active_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://active_app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /version {
        proxy_pass http://active_app/version;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
