services:
  # ============================================================
  # 1. MySQL Primary Node (Leader / RW on Port 3306)
  # ============================================================
  mysql-primary:
    image: mysql:8.0
    container_name: mockmate-mysql-primary
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mock_mate}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
    ports:
      - "${DB_PRIMARY_PORT:-3306}:3306"
    volumes:
      - ./infrastructure/mysql/primary/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./infrastructure/mysql/init-scripts:/docker-entrypoint-initdb.d:ro
      - mysql-primary-data:/var/lib/mysql
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-jaison}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  # ============================================================
  # 2. MySQL Read Replica 1 (Follower on Port 3307)
  # ============================================================
  mysql-replica-1:
    image: mysql:8.0
    container_name: mockmate-mysql-replica-1
    restart: unless-stopped
    depends_on:
      mysql-primary:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
    ports:
      - "${DB_REPLICA1_PORT:-3307}:3306"
    volumes:
      - ./infrastructure/mysql/replica/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - mysql-replica1-data:/var/lib/mysql
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-jaison}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  # ============================================================
  # 3. MySQL Read Replica 2 (Follower on Port 3308)
  # ============================================================
  mysql-replica-2:
    image: mysql:8.0
    container_name: mockmate-mysql-replica-2
    restart: unless-stopped
    depends_on:
      mysql-primary:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
    ports:
      - "${DB_REPLICA2_PORT:-3308}:3306"
    volumes:
      - ./infrastructure/mysql/replica/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - mysql-replica2-data:/var/lib/mysql
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-jaison}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  # ============================================================
  # 4. Failover & Topology Health Daemon
  # ============================================================
  db-failover-manager:
    image: python:3.10-slim
    container_name: mockmate-failover-manager
    restart: unless-stopped
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica-1:
        condition: service_healthy
      mysql-replica-2:
        condition: service_healthy
    volumes:
      - ./infrastructure/scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /scripts
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
      PRIMARY_HOST: mysql-primary
      PRIMARY_PORT: 3306
      REPLICA1_HOST: mysql-replica-1
      REPLICA1_PORT: 3306
      REPLICA2_HOST: mysql-replica-2
      REPLICA2_PORT: 3306
    entrypoint: ["bash", "-c", "apt-get update && apt-get install -y default-mysql-client && python /scripts/failover_manager.py"]
    networks:
      - mockmate-network

  # ============================================================
  # 5. Isolated Sandbox MySQL (Interview Database Playground on Port 3309)
  # ============================================================
  sandbox-db:
    image: mysql:8.0
    container_name: mockmate-sandbox-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandbox_root_pass_2026}
      MYSQL_DATABASE: sandbox_default
    ports:
      - "${SANDBOX_DB_EXTERNAL_PORT:-3309}:3306"
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${SANDBOX_DB_PASSWORD:-sandbox_root_pass_2026}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ============================================================
  # 6. Go Backend API Service (Read/Write Splitting with GORM)
  # ============================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mockmate-server
    restart: unless-stopped
    environment:
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      DB_HOST: mysql-primary
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
      DB_NAME: ${MYSQL_DATABASE:-mock_mate}
      DB_REPLICA_HOSTS: mysql-replica-1:3306,mysql-replica-2:3306
      SANDBOX_DB_HOST: ${SANDBOX_DB_HOST:-sandbox-db}
      SANDBOX_DB_PORT: ${SANDBOX_DB_PORT:-3306}
      SANDBOX_DB_USER: ${SANDBOX_DB_USER:-root}
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandbox_root_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-mock_mate_secure_jwt_secret_2026}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - audio_recordings:/app/uploads
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica-1:
        condition: service_healthy
      mysql-replica-2:
        condition: service_healthy
    networks:
      - mockmate-network

  # ============================================================
  # 7. React Frontend (Nginx SPA + Reverse Proxy on Port 80)
  # ============================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: mockmate-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - mockmate-network

  # ============================================================
  # 8. Cloudflare Tunnel (Optional)
  # ============================================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mockmate-cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - mockmate-network
    profiles:
      - tunnel
    depends_on:
      - client
      - server

volumes:
  mysql-primary-data:
  mysql-replica1-data:
  mysql-replica2-data:
  audio_recordings:
    driver: local

networks:
  mockmate-network:
    driver: bridge
