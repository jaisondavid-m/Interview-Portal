services:
  # ============================================================
  # 1. MySQL Primary Node (Leader / RW on Port 3306)
  # ============================================================
  mysql-primary:
    image: mysql:8.0
    container_name: mockmate-mysql-primary
    restart: unless-stopped
    command:
      - "mysqld"
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-authentication-plugin=mysql_native_password"
      - "--max_connections=1000"
      - "--innodb_buffer_pool_size=2G"
      - "--table_open_cache=4000"
      - "--thread_cache_size=64"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mock_mate}
    ports:
      - "${DB_PRIMARY_PORT:-3306}:3306"
    volumes:
      - ./infrastructure/mysql/init-scripts:/docker-entrypoint-initdb.d:ro
      - mysql-primary-data:/var/lib/mysql
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-jaison}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  # ============================================================
  # 2. MySQL Read Replica 1 (Follower on Port 3307)
  # ============================================================
  mysql-replica-1:
    image: mysql:8.0
    container_name: mockmate-mysql-replica-1
    restart: unless-stopped
    depends_on:
      mysql-primary:
        condition: service_healthy
    command:
      - "mysqld"
      - "--server-id=2"
      - "--log-bin=mysql-bin"
      - "--relay-log=mysql-relay-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-authentication-plugin=mysql_native_password"
      - "--max_connections=1000"
      - "--innodb_buffer_pool_size=1G"
      - "--table_open_cache=4000"
      - "--thread_cache_size=64"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
    ports:
      - "${DB_REPLICA1_PORT:-3307}:3306"
    volumes:
      - mysql-replica1-data:/var/lib/mysql
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-jaison}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  # ============================================================
  # 3. MySQL Read Replica 2 (Follower on Port 3308)
  # ============================================================
  mysql-replica-2:
    image: mysql:8.0
    container_name: mockmate-mysql-replica-2
    restart: unless-stopped
    depends_on:
      mysql-primary:
        condition: service_healthy
    command:
      - "mysqld"
      - "--server-id=3"
      - "--log-bin=mysql-bin"
      - "--relay-log=mysql-relay-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-authentication-plugin=mysql_native_password"
      - "--max_connections=1000"
      - "--innodb_buffer_pool_size=1G"
      - "--table_open_cache=4000"
      - "--thread_cache_size=64"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
    ports:
      - "${DB_REPLICA2_PORT:-3308}:3306"
    volumes:
      - mysql-replica2-data:/var/lib/mysql
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-jaison}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  # ============================================================
  # 4. Failover & Topology Health Daemon
  # ============================================================
  db-failover-manager:
    image: python:3.10-slim
    container_name: mockmate-failover-manager
    restart: unless-stopped
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica-1:
        condition: service_healthy
      mysql-replica-2:
        condition: service_healthy
    volumes:
      - ./infrastructure/scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /scripts
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
      PRIMARY_HOST: mysql-primary
      PRIMARY_PORT: 3306
      REPLICA1_HOST: mysql-replica-1
      REPLICA1_PORT: 3306
      REPLICA2_HOST: mysql-replica-2
      REPLICA2_PORT: 3306
    entrypoint: ["bash", "-c", "apt-get update && apt-get install -y default-mysql-client && python /scripts/failover_manager.py"]
    networks:
      - mockmate-network

  # ============================================================
  # 5. Isolated Sandbox MySQL (Interview Database Playground on Port 3309)
  # ============================================================
  sandbox-db:
    image: mysql:8.0
    container_name: mockmate-sandbox-db
    restart: unless-stopped
    command:
      - "mysqld"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-authentication-plugin=mysql_native_password"
      - "--max_connections=1000"
      - "--innodb_buffer_pool_size=4G"
      - "--table_open_cache=4000"
      - "--thread_cache_size=64"
      - "--innodb_flush_log_at_trx_commit=2"
    environment:
      MYSQL_ROOT_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandbox_root_pass_2026}
      MYSQL_DATABASE: sandbox_default
    ports:
      - "${SANDBOX_DB_EXTERNAL_PORT:-3309}:3306"
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${SANDBOX_DB_PASSWORD:-sandbox_root_pass_2026}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ============================================================
  # 6. Redis Container (Sliding Window Rate Limiting & Config Cache)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: mockmate-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # 7. Go Backend API Service - BLUE Environment (Port 8081)
  # ============================================================
  app-blue:
    build:
      context: ./server
      dockerfile: Dockerfile
      network: host
    container_name: mockmate-app-blue
    restart: unless-stopped
    environment:
      PORT: 8080
      APP_COLOR: ${BLUE_COLOR:-blue}
      APP_VERSION: ${BLUE_VERSION:-v1.0.0}
      GIN_MODE: ${GIN_MODE:-release}
      DB_HOST: mysql-primary
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
      DB_NAME: ${MYSQL_DATABASE:-mock_mate}
      DB_REPLICA_HOSTS: mysql-replica-1:3306,mysql-replica-2:3306
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-500}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-50}
      SANDBOX_DB_HOST: ${SANDBOX_DB_HOST:-sandbox-db}
      SANDBOX_DB_PORT: ${SANDBOX_DB_PORT:-3306}
      SANDBOX_DB_USER: ${SANDBOX_DB_USER:-root}
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandbox_root_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-mock_mate_secure_jwt_secret_2026}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "${BLUE_PORT:-8081}:8080"
    tmpfs:
      - /tmp:rw,size=4G,mode=1777
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535
    volumes:
      - audio_recordings:/app/uploads
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica-1:
        condition: service_healthy
      mysql-replica-2:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q 'success' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ============================================================
  # 8. Go Backend API Service - GREEN Environment (Port 8082)
  # ============================================================
  app-green:
    build:
      context: ./server
      dockerfile: Dockerfile
      network: host
    container_name: mockmate-app-green
    restart: unless-stopped
    environment:
      PORT: 8080
      APP_COLOR: ${GREEN_COLOR:-green}
      APP_VERSION: ${GREEN_VERSION:-v1.1.0}
      GIN_MODE: ${GIN_MODE:-release}
      DB_HOST: mysql-primary
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
      DB_NAME: ${MYSQL_DATABASE:-mock_mate}
      DB_REPLICA_HOSTS: mysql-replica-1:3306,mysql-replica-2:3306
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-500}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-50}
      SANDBOX_DB_HOST: ${SANDBOX_DB_HOST:-sandbox-db}
      SANDBOX_DB_PORT: ${SANDBOX_DB_PORT:-3306}
      SANDBOX_DB_USER: ${SANDBOX_DB_USER:-root}
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandbox_root_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-mock_mate_secure_jwt_secret_2026}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "${GREEN_PORT:-8082}:8080"
    tmpfs:
      - /tmp:rw,size=4G,mode=1777
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535
    volumes:
      - audio_recordings:/app/uploads
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica-1:
        condition: service_healthy
      mysql-replica-2:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q 'success' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ============================================================
  # 9. React Frontend & Nginx Router (Port 80)
  # ============================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: mockmate-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/active_upstream.conf:/etc/nginx/conf.d/active_upstream.conf:ro
    depends_on:
      - app-blue
    networks:
      - mockmate-network

  # ============================================================
  # 10. Cloudflare Tunnel (Ingress to Nginx Port 80)
  # ============================================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mockmate-cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - mockmate-network
    profiles:
      - tunnel
    depends_on:
      - client

volumes:
  mysql-primary-data:
  mysql-replica1-data:
  mysql-replica2-data:
  redis-data:
  audio_recordings:
    driver: local

networks:
  mockmate-network:
    driver: bridge
