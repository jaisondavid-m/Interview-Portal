services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.0
    container_name: mockmate-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mock_mate}
      MYSQL_USER: ${MYSQL_USER:-mockmate_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mockmate_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    networks:
      - mockmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-jaison}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==========================================
  # Go Backend API Service
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mockmate-server
    restart: unless-stopped
    environment:
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jaison}
      DB_NAME: ${MYSQL_DATABASE:-mock_mate}
      JWT_SECRET: ${JWT_SECRET:-mock_mate_secure_jwt_secret_2026}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mockmate-network

  # ==========================================
  # React Frontend (Nginx SPA + Reverse Proxy)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: mockmate-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - mockmate-network

  # ==========================================
  # Cloudflare Tunnel (Optional / Automated)
  # ==========================================
  # To use: Set TUNNEL_TOKEN in your .env file and run: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mockmate-cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - mockmate-network
    profiles:
      - tunnel
    depends_on:
      - client
      - server

volumes:
  mysql_data:
    driver: local

networks:
  mockmate-network:
    driver: bridge
